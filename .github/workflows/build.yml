name: Build Desktop Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: DO-Client-linux
            binary: dist/DO-Client
          - os: windows-latest
            artifact: DO-Client-windows
            binary: dist/DO-Client.exe
          - os: macos-latest
            artifact: DO-Client-macos
            binary: dist/DO-Client

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --windowed
          --name DO-Client
          --add-data "config.py:."
          app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Rename artifacts for clarity
        run: |
          mv artifacts/DO-Client-linux/DO-Client    artifacts/DO-Client-linux
          mv artifacts/DO-Client-windows/DO-Client.exe  artifacts/DO-Client-windows.exe
          mv artifacts/DO-Client-macos/DO-Client    artifacts/DO-Client-macos
          chmod +x artifacts/DO-Client-linux artifacts/DO-Client-macos

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "DO Client $TAG" \
            --generate-notes \
            artifacts/DO-Client-linux \
            artifacts/DO-Client-windows.exe \
            artifacts/DO-Client-macos
