name: Build Desktop Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-windows:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: DO-Client-linux
            binary: dist/DO-Client
          - os: windows-latest
            artifact: DO-Client-windows
            binary: dist/DO-Client.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --windowed
          --name DO-Client
          --add-data "config.py:."
          app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build .app bundle
        run: >
          pyinstaller
          --windowed
          --name DO-Client
          --add-data "config.py:."
          app.py

      - name: Zip .app bundle
        run: cd dist && zip -r DO-Client-macos.zip DO-Client.app/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DO-Client-macos
          path: dist/DO-Client-macos.zip

  release:
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Flatten artifacts
        run: |
          cp artifacts/DO-Client-linux/DO-Client       DO-Client-linux
          cp artifacts/DO-Client-windows/DO-Client.exe DO-Client-windows.exe
          cp artifacts/DO-Client-macos/DO-Client-macos.zip DO-Client-macos.zip
          chmod +x DO-Client-linux

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "DO Client $TAG" \
            --generate-notes \
            DO-Client-linux \
            DO-Client-windows.exe \
            DO-Client-macos.zip
